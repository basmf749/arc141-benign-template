<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Dashboard</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #f6f7f9;
      color: #1d2433;
    }
    header {
      padding: 28px 32px 12px;
    }
    header h1 { margin: 0 0 4px; font-size: 24px; }
    header p { margin: 0; color: #5b6472; font-size: 14px; }
    main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      padding: 20px 32px 40px;
      max-width: 960px;
    }
    section {
      background: #fff;
      border: 1px solid #e3e6eb;
      border-radius: 10px;
      padding: 18px;
    }
    section h2 { margin: 0 0 12px; font-size: 15px; text-transform: uppercase; letter-spacing: .04em; color: #5b6472; }
    form { display: flex; gap: 8px; margin-bottom: 14px; }
    input[type="text"] {
      flex: 1;
      padding: 9px 10px;
      border: 1px solid #cfd4dc;
      border-radius: 7px;
      font-size: 14px;
    }
    button {
      padding: 9px 14px;
      border: 0;
      border-radius: 7px;
      background: #2563eb;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    ul { list-style: none; margin: 0; padding: 0; }
    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid #eef0f3;
      font-size: 14px;
    }
    li:last-child { border-bottom: 0; }
    .done { text-decoration: line-through; color: #8a93a2; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .stat { background: #f6f7f9; border-radius: 8px; padding: 12px; }
    .stat strong { display: block; font-size: 22px; }
    .stat span { font-size: 12px; color: #5b6472; }
    @media (max-width: 720px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>Task Dashboard</h1>
    <p>Keep track of today's work in one place.</p>
  </header>
  <main>
    <section>
      <h2>Add a task</h2>
      <form id="task-form">
        <input id="task-input" type="text" placeholder="What needs doing?" autocomplete="off" />
        <button type="submit">Add</button>
      </form>
      <ul id="task-list"></ul>
    </section>
    <section>
      <h2>Overview</h2>
      <div class="stats">
        <div class="stat"><strong id="stat-total">0</strong><span>Total</span></div>
        <div class="stat"><strong id="stat-open">0</strong><span>Open</span></div>
        <div class="stat"><strong id="stat-done">0</strong><span>Done</span></div>
      </div>
    </section>
  </main>
  <script>
    const list = document.getElementById('task-list');
    const form = document.getElementById('task-form');
    const input = document.getElementById('task-input');
    const tasks = [];

    function render() {
      list.innerHTML = '';
      tasks.forEach((task, index) => {
        const item = document.createElement('li');
        const label = document.createElement('span');
        label.textContent = task.title;
        if (task.done) label.className = 'done';
        label.addEventListener('click', () => {
          task.done = !task.done;
          render();
        });
        const remove = document.createElement('button');
        remove.textContent = 'Remove';
        remove.addEventListener('click', () => {
          tasks.splice(index, 1);
          render();
        });
        item.append(label, remove);
        list.append(item);
      });
      document.getElementById('stat-total').textContent = tasks.length;
      document.getElementById('stat-done').textContent = tasks.filter(t => t.done).length;
      document.getElementById('stat-open').textContent = tasks.filter(t => !t.done).length;
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const title = input.value.trim();
      if (!title) return;
      tasks.push({ title, done: false });
      input.value = '';
      render();
    });

    render();
  </script>
</body>
</html>
